[project]
name = "project-forecast"
version = "0.1.0"
description = "Here, we will study how to generate forecasts"
readme = "README.md"
authors = [
    { name = "EddyGiusepe", email = "eddychirinos.unac@gmail.com" }
]
requires-python = ">=3.13.7, <3.14"
dependencies = [
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "nbformat==5.11.1",
    "plotly==7.1.0",
    "scikit-learn==1.9.1",
    "skforecast==0.26.0",
    "statsmodels>=0.15.0",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
]

[tool.ruff]
extend = "ruff.toml"
